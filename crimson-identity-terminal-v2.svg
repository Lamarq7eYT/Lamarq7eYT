<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="title desc">
<title id="title">Evandro Identity Terminal</title><desc id="desc">Animated TypeScript editor and CRT terminal presenting Evandro's professional identity.</desc>
<defs>
<linearGradient id="terminalGlow" x1="0" x2="1"><stop offset="0" stop-color="#35e6d2" stop-opacity="0"/><stop offset=".5" stop-color="#35e6d2" stop-opacity=".16"/><stop offset="1" stop-color="#35e6d2" stop-opacity="0"/></linearGradient>
<linearGradient id="crtWave" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#35e6d2" stop-opacity="0"/><stop offset=".46" stop-color="#35e6d2" stop-opacity=".025"/><stop offset=".5" stop-color="#8ffff0" stop-opacity=".14"/><stop offset=".54" stop-color="#35e6d2" stop-opacity=".035"/><stop offset="1" stop-color="#35e6d2" stop-opacity="0"/></linearGradient>
<pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#35e6d2" opacity=".025"/></pattern>
<filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
<style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.muted{fill:#7f858d}.white{fill:#e8edf1}.cyan{fill:#35e6d2}.code{font-size:18px}.small{font-size:14px}.output{font-size:18px;fill:#cbd3d6}</style>
</defs>
<rect width="1400" height="610" fill="#050505"/><rect x="24" y="22" width="1352" height="566" rx="12" fill="#08090a" stroke="#1d2227" stroke-width="1.4"/><ellipse cx="1210" cy="505" rx="180" ry="90" fill="#35e6d2" opacity=".035" filter="url(#softGlow)"/>
<rect x="48" y="42" width="1304" height="44" rx="8" fill="#0d1012" stroke="#20262b"/><circle cx="72" cy="64" r="5" fill="#ff1538"/><circle cx="90" cy="64" r="5" fill="#d6a52a"/><circle cx="108" cy="64" r="5" fill="#35e6d2"/><text x="136" y="69" class="mono small muted">identity.ts</text><text x="1230" y="69" class="mono small cyan">TYPESCRIPT</text>
<g class="mono code"><text x="72" y="122" fill="#555d66">1</text><text x="108" y="122" fill="#c586c0">import</text><text x="176" y="122" fill="#d4d4d4"> { </text><text x="202" y="122" fill="#4ec9b0">Identity</text><text x="286" y="122" fill="#d4d4d4"> } </text><text x="308" y="122" fill="#c586c0">from</text><text x="356" y="122" fill="#ce9178"> "./profile"</text><text x="466" y="122" fill="#d4d4d4">;</text><text x="72" y="158" fill="#555d66">2</text><text x="108" y="158" fill="#9cdcfe">console</text><text x="177" y="158" fill="#d4d4d4">.</text><text x="188" y="158" fill="#dcdcaa">log</text><text x="219" y="158" fill="#d4d4d4">(</text><text x="230" y="158" fill="#4ec9b0">Identity</text><text x="314" y="158" fill="#d4d4d4">);</text><rect x="108" y="175" width="112" height="2" fill="#35e6d2" opacity=".18"/></g>
<rect x="48" y="204" width="1304" height="356" rx="10" fill="#05090a" stroke="#244047" stroke-width="1.2"/><rect x="48" y="204" width="1304" height="42" rx="10" fill="#0b1113"/><path d="M48 246h1304" stroke="#233238"/><circle cx="72" cy="225" r="4" fill="#35e6d2"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="86" y="230" class="mono small cyan">TERMINAL</text><text x="1195" y="230" class="mono small muted">node identity.ts</text>
<text x="76" y="280" class="mono small cyan">evandro@profile</text><text x="210" y="280" class="mono small muted">:</text><text x="220" y="280" class="mono small" fill="#8ab4f8">~/identity</text><text x="306" y="280" class="mono small white"> $ </text><text x="330" y="280" class="mono small white">tsx identity.ts</text>
<g class="mono output"><text x="76" y="326">I'm Evandro, a <tspan fill="#fff" font-weight="700">Full-Stack Developer and 2D/3D Animator</tspan>, committed to continuous</text><text x="76" y="356">technical and creative growth. I focus on building stronger foundations, refining the quality of my work,</text><text x="76" y="386">and expanding my experience as I prepare to enter the professional market.</text><text x="76" y="440">I enjoy turning ideas into practical projects, learning through experimentation, and continuously improving</text><text x="76" y="470">the way I design, develop, and present what I create.</text></g>
<rect x="49" y="247" width="1302" height="311" fill="url(#scanlines)" pointer-events="none"/><rect x="49" y="247" width="1302" height="70" fill="url(#crtWave)" pointer-events="none"><animate attributeName="y" values="242;500;242" dur="6.2s" repeatCount="indefinite"/></rect><rect x="-360" y="258" width="300" height="270" fill="url(#terminalGlow)" opacity=".38" transform="skewX(-14)"><animate attributeName="x" values="-360;1460" dur="9s" repeatCount="indefinite"/></rect>
<path d="M65 542h315" stroke="#35e6d2" stroke-width="2" opacity=".55"/><path d="M1145 222h165" stroke="#ff1538" stroke-width="1.5" opacity=".32"/><g fill="none" stroke="#35e6d2" opacity=".16"><polygon points="1270,282 1285,273 1300,282 1300,300 1285,309 1270,300"><animateTransform attributeName="transform" type="translate" values="0 0;0 7;0 0" dur="8s" repeatCount="indefinite"/></polygon></g>
</svg>