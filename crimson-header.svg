<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Evandro crimson corridor header">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#260006"/><stop offset=".32" stop-color="#070506"/><stop offset=".72" stop-color="#0b0607"/><stop offset="1" stop-color="#190003"/></linearGradient>
 <linearGradient id="redWall" x1="0" x2="1"><stop stop-color="#ff102f"/><stop offset=".45" stop-color="#a9001d"/><stop offset="1" stop-color="#240006"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#090707"/><stop offset="1" stop-color="#280006"/></linearGradient>
 <radialGradient id="hot"><stop stop-color="#ff654f" stop-opacity=".9"/><stop offset=".35" stop-color="#ff1538" stop-opacity=".45"/><stop offset="1" stop-color="#ff1538" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter><filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
 <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".7" fill="#fff" opacity=".025"/><circle cx="7" cy="5" r=".55" fill="#fff" opacity=".018"/><circle cx="4" cy="8" r=".5" fill="#ff1538" opacity=".025"/></pattern>
 <clipPath id="scene"><rect width="1200" height="420"/></clipPath>
</defs>
<rect width="1200" height="420" fill="url(#bg)"/>
<!-- cinematic corridor inspired by the supplied motion reference -->
<g clip-path="url(#scene)">
 <path d="M0 0H345L465 420H0Z" fill="url(#redWall)" opacity=".88"/>
 <path d="M1200 0H880L735 420H1200Z" fill="#120507"/>
 <path d="M0 420L430 155H775L1200 420Z" fill="url(#floor)"/>
 <path d="M430 155L510 0H720L775 155Z" fill="#050505"/>
 <!-- right illuminated architectural panels -->
 <g transform="skewY(-8)">
  <rect x="880" y="22" width="74" height="188" fill="#ff2a22" opacity=".92"/><rect x="970" y="-2" width="84" height="202" fill="#ff401f" opacity=".96"/><rect x="1070" y="-30" width="92" height="218" fill="#ff5a25" opacity=".9"/>
  <rect x="892" y="35" width="7" height="160" fill="#ffb08a" opacity=".25"/>
 </g>
 <!-- ceiling red lights -->
 <g fill="#ff1538"><path d="M382 37l48 4 27 22-45 3z"/><path d="M535 67l30 2 17 13-29 2z" opacity=".9"/><path d="M651 90l22 1 12 9-21 2z" opacity=".8"/><path d="M756 65l34-4-13 17-31 5z" opacity=".85"/></g>
 <!-- corridor rails/perspective -->
 <g fill="none" stroke="#ff1538" opacity=".42"><path d="M0 104L446 190" stroke-width="5"/><path d="M1200 92L765 188" stroke-width="4"/><path d="M84 420L455 188"/><path d="M1110 420L762 188"/></g>
 <!-- drifting red fragments -->
 <g fill="#ff1538">
  <path d="M475 114l25-5 15 8-26 7"><animateTransform attributeName="transform" type="translate" values="0 0;16 -7;0 0" dur="5.8s" repeatCount="indefinite"/></path>
  <path d="M705 120l21-4 10 7-21 5"><animateTransform attributeName="transform" type="translate" values="0 0;-13 9;0 0" dur="7s" repeatCount="indefinite"/></path>
  <path d="M816 92l25-8-8 18-24 7"><animateTransform attributeName="transform" type="translate" values="0 0;7 -9;0 0" dur="6.3s" repeatCount="indefinite"/></path>
 </g>
 <!-- moving crimson light washes -->
 <ellipse cx="80" cy="220" rx="260" ry="210" fill="url(#hot)" opacity=".52" filter="url(#blur)"><animate attributeName="cx" values="-40;120;-40" dur="7s" repeatCount="indefinite"/></ellipse>
 <path d="M-180 365L610 180L700 225L-100 420Z" fill="#ff1538" opacity=".10" filter="url(#blur8)"><animateTransform attributeName="transform" type="translate" values="-90 0;130 0;-90 0" dur="8s" repeatCount="indefinite"/></path>
 <path d="M760 420L1010 145L1080 160L880 420Z" fill="#ff351f" opacity=".11" filter="url(#blur8)"><animate attributeName="opacity" values=".05;.17;.05" dur="4.6s" repeatCount="indefinite"/></path>
 <!-- distant silhouette for depth, abstract rather than copied character -->
 <g opacity=".58" fill="#020202"><circle cx="674" cy="171" r="15"/><path d="M654 188l38 0 19 93-20 74h-42l-14-74z"/><path d="M648 214l-36 72 12 5 42-62z"/><path d="M692 211l28 78 12-5-22-82z"/></g>
 <rect width="1200" height="420" fill="url(#grain)"/>
</g>
<!-- readable foreground UI -->
<rect x="45" y="34" width="1110" height="352" rx="8" fill="#020203" opacity=".18" stroke="#ff1538" stroke-opacity=".15"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="78" y="72" fill="#ffb2bd" font-size="15" letter-spacing="3">SYSTEM 01</text><circle cx="1065" cy="67" r="5" fill="#ff1538"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle><text x="1082" y="72" fill="#f0dadd" font-size="14">ONLINE</text></g>
<!-- dark readability plate behind main title -->
<path d="M48 120H690L635 330H48Z" fill="#030303" opacity=".58"/>
<text x="78" y="215" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="100" font-weight="800" letter-spacing="2">EVANDRO</text>
<rect x="78" y="247" width="320" height="4" fill="#ff1538"><animate attributeName="width" values="110;320;255;320" dur="6s" repeatCount="indefinite"/></rect>
<text x="80" y="300" fill="#ded5d6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" letter-spacing="3">FULL-STACK DEVELOPER • 2D/3D ANIMATOR</text>
</svg>