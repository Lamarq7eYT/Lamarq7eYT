<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Evandro Identity Terminal</title>
<desc id="desc">Animated TypeScript editor and CRT terminal presenting Evandro's professional identity.</desc>
<defs>
  <linearGradient id="terminalGlow" x1="0" x2="1"><stop offset="0" stop-color="#35e6d2" stop-opacity="0"/><stop offset=".5" stop-color="#35e6d2" stop-opacity=".17"/><stop offset="1" stop-color="#35e6d2" stop-opacity="0"/></linearGradient>
  <linearGradient id="crtWave" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#35e6d2" stop-opacity="0"/><stop offset=".46" stop-color="#35e6d2" stop-opacity=".025"/><stop offset=".5" stop-color="#8ffff0" stop-opacity=".15"/><stop offset=".54" stop-color="#35e6d2" stop-opacity=".035"/><stop offset="1" stop-color="#35e6d2" stop-opacity="0"/></linearGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#35e6d2" opacity=".028"/></pattern>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="11"/></filter>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .muted{fill:#7f858d}.white{fill:#e8edf1}.cyan{fill:#35e6d2}
    .code{font-size:21px}.small{font-size:16px}.output{font-size:20px;fill:#cbd3d6}
  </style>
</defs>

<rect width="1200" height="650" fill="#050505"/>
<rect x="20" y="20" width="1160" height="610" rx="14" fill="#08090a" stroke="#1d2227" stroke-width="1.6"/>
<ellipse cx="1030" cy="535" rx="175" ry="95" fill="#35e6d2" opacity=".04" filter="url(#softGlow)"/>

<!-- editor -->
<rect x="44" y="42" width="1112" height="52" rx="9" fill="#0d1012" stroke="#20262b"/>
<circle cx="70" cy="68" r="6" fill="#ff1538"/><circle cx="91" cy="68" r="6" fill="#d6a52a"/><circle cx="112" cy="68" r="6" fill="#35e6d2"/>
<text x="144" y="74" class="mono small muted">identity.ts</text>
<text x="1012" y="74" class="mono small cyan">TYPESCRIPT</text>

<g class="mono code">
  <text x="70" y="137" fill="#555d66">1</text>
  <text x="112" y="137" fill="#c586c0">import</text><text x="192" y="137" fill="#d4d4d4"> { </text><text x="222" y="137" fill="#4ec9b0">Identity</text><text x="322" y="137" fill="#d4d4d4"> } </text><text x="350" y="137" fill="#c586c0">from</text><text x="408" y="137" fill="#ce9178"> "./profile"</text><text x="542" y="137" fill="#d4d4d4">;</text>
  <text x="70" y="180" fill="#555d66">2</text>
  <text x="112" y="180" fill="#9cdcfe">console</text><text x="193" y="180" fill="#d4d4d4">.</text><text x="207" y="180" fill="#dcdcaa">log</text><text x="244" y="180" fill="#d4d4d4">(</text><text x="258" y="180" fill="#4ec9b0">Identity</text><text x="358" y="180" fill="#d4d4d4">);</text>
  <rect x="112" y="198" width="128" height="2" fill="#35e6d2" opacity=".2"/>
</g>

<!-- terminal -->
<rect x="44" y="228" width="1112" height="370" rx="11" fill="#05090a" stroke="#244047" stroke-width="1.4"/>
<rect x="44" y="228" width="1112" height="48" rx="11" fill="#0b1113"/>
<path d="M44 276h1112" stroke="#233238"/>
<circle cx="70" cy="252" r="4.5" fill="#35e6d2"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="86" y="258" class="mono small cyan">TERMINAL</text>
<text x="1012" y="258" class="mono small muted">node identity.ts</text>

<text x="74" y="312" class="mono small cyan">evandro@profile</text><text x="228" y="312" class="mono small muted">:</text><text x="240" y="312" class="mono small" fill="#8ab4f8">~/identity</text><text x="338" y="312" class="mono small white"> $ </text><text x="366" y="312" class="mono small white">tsx identity.ts</text>

<g class="mono output">
  <text x="74" y="360">I'm Evandro, a <tspan fill="#ffffff" font-weight="700">Full-Stack Developer and 2D/3D Animator</tspan>, committed to</text>
  <text x="74" y="396">continuous technical and creative growth. I focus on building stronger foundations, refining</text>
  <text x="74" y="432">the quality of my work, and expanding my experience as I prepare to enter the professional market.</text>
  <text x="74" y="490">I enjoy turning ideas into practical projects, learning through experimentation, and continuously</text>
  <text x="74" y="526">improving the way I design, develop, and present what I create.</text>
</g>

<!-- CRT treatment -->
<rect x="45" y="277" width="1110" height="320" fill="url(#scanlines)" pointer-events="none"/>
<rect x="45" y="277" width="1110" height="78" fill="url(#crtWave)" pointer-events="none"><animate attributeName="y" values="270;510;270" dur="6s" repeatCount="indefinite"/></rect>
<rect x="-320" y="292" width="300" height="275" fill="url(#terminalGlow)" opacity=".4" transform="skewX(-14)"><animate attributeName="x" values="-320;1280" dur="9s" repeatCount="indefinite"/></rect>

<path d="M64 574h340" stroke="#35e6d2" stroke-width="2" opacity=".58"/>
<path d="M944 246h168" stroke="#ff1538" stroke-width="1.5" opacity=".32"/>
<g fill="none" stroke="#35e6d2" opacity=".17"><polygon points="1068,332 1084,323 1100,332 1100,351 1084,360 1068,351"><animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="8s" repeatCount="indefinite"/></polygon></g>
</svg>