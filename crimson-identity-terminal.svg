<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Evandro Identity Terminal</title>
  <desc id="desc">Animated TypeScript editor and CRT terminal presenting Evandro's professional identity.</desc>
  <defs>
    <linearGradient id="terminalGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#35e6d2" stop-opacity="0"/>
      <stop offset=".5" stop-color="#35e6d2" stop-opacity=".18"/>
      <stop offset="1" stop-color="#35e6d2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crtWave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35e6d2" stop-opacity="0"/>
      <stop offset=".45" stop-color="#35e6d2" stop-opacity=".03"/>
      <stop offset=".5" stop-color="#8ffff0" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#35e6d2" stop-opacity=".04"/>
      <stop offset="1" stop-color="#35e6d2" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#35e6d2" opacity=".035"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .ui{font-family:Arial,Helvetica,sans-serif}
      .muted{fill:#7f858d}.white{fill:#e8edf1}.cyan{fill:#35e6d2}.red{fill:#ff1538}
      .code{font-size:18px}.small{font-size:14px}.output{font-size:19px;fill:#c8d2d5}
    </style>
  </defs>

  <rect width="1200" height="610" fill="#050505"/>
  <rect x="28" y="22" width="1144" height="566" rx="12" fill="#08090a" stroke="#1d2227" stroke-width="1.4"/>
  <ellipse cx="1030" cy="505" rx="190" ry="100" fill="#35e6d2" opacity=".04" filter="url(#softGlow)"/>

  <!-- editor title bar -->
  <rect x="48" y="42" width="1104" height="44" rx="8" fill="#0d1012" stroke="#20262b"/>
  <circle cx="72" cy="64" r="5" fill="#ff1538" opacity=".85"/>
  <circle cx="90" cy="64" r="5" fill="#d6a52a" opacity=".72"/>
  <circle cx="108" cy="64" r="5" fill="#35e6d2" opacity=".76"/>
  <text x="136" y="69" class="mono small muted">identity.ts</text>
  <text x="1070" y="69" class="mono small cyan">TYPESCRIPT</text>

  <!-- TypeScript source -->
  <g class="mono code">
    <text x="72" y="122" fill="#555d66">1</text>
    <text x="108" y="122" fill="#c586c0">import</text><text x="176" y="122" fill="#d4d4d4"> { </text><text x="202" y="122" fill="#4ec9b0">Identity</text><text x="286" y="122" fill="#d4d4d4"> } </text><text x="308" y="122" fill="#c586c0">from</text><text x="356" y="122" fill="#ce9178"> "./profile"</text><text x="466" y="122" fill="#d4d4d4">;</text>
    <text x="72" y="158" fill="#555d66">2</text>
    <text x="108" y="158" fill="#9cdcfe">console</text><text x="177" y="158" fill="#d4d4d4">.</text><text x="188" y="158" fill="#dcdcaa">log</text><text x="219" y="158" fill="#d4d4d4">(</text><text x="230" y="158" fill="#4ec9b0">Identity</text><text x="314" y="158" fill="#d4d4d4">);</text>
    <rect x="108" y="175" width="112" height="2" fill="#35e6d2" opacity=".18"/>
  </g>

  <!-- terminal panel -->
  <rect x="48" y="204" width="1104" height="356" rx="10" fill="#05090a" stroke="#244047" stroke-width="1.2"/>
  <rect x="48" y="204" width="1104" height="42" rx="10" fill="#0b1113"/>
  <path d="M48 236h1104" stroke="#233238"/>
  <circle cx="72" cy="225" r="4" fill="#35e6d2"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="86" y="230" class="mono small cyan">TERMINAL</text>
  <text x="1052" y="230" class="mono small muted">node identity.ts</text>

  <!-- command -->
  <text x="76" y="280" class="mono small cyan">evandro@profile</text><text x="210" y="280" class="mono small muted">:</text><text x="220" y="280" class="mono small" fill="#8ab4f8">~/identity</text><text x="306" y="280" class="mono small white"> $ </text><text x="330" y="280" class="mono small white">tsx identity.ts</text>

  <!-- identity output -->
  <g class="mono output" filter="url(#textGlow)">
    <text x="76" y="326">I'm Evandro, a </text><text x="246" y="326" fill="#ffffff" font-weight="700">Full-Stack Developer and 2D/3D Animator</text><text x="661" y="326"> committed to</text>
    <text x="76" y="356">continuous technical and creative growth. I focus on building stronger foundations,</text>
    <text x="76" y="386">refining the quality of my work, and expanding my experience as I prepare to enter</text>
    <text x="76" y="416">the professional market.</text>
    <text x="76" y="462">I enjoy turning ideas into practical projects, learning through experimentation,</text>
    <text x="76" y="492">and continuously improving the way I design, develop, and present what I create.</text>
  </g>

  <!-- CRT treatment -->
  <rect x="49" y="247" width="1102" height="311" fill="url(#scanlines)" pointer-events="none"/>
  <rect x="49" y="247" width="1102" height="76" fill="url(#crtWave)" pointer-events="none">
    <animate attributeName="y" values="236;520;236" dur="5.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="-320" y="258" width="300" height="270" fill="url(#terminalGlow)" opacity=".45" transform="skewX(-14)">
    <animate attributeName="x" values="-320;1260" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- subtle terminal frame accents -->
  <path d="M65 542h315" stroke="#35e6d2" stroke-width="2" opacity=".65"><animate attributeName="x2" values="220;430;360" dur="6s" repeatCount="indefinite"/></path>
  <path d="M944 222h170" stroke="#ff1538" stroke-width="1.5" opacity=".36"/>
  <g fill="none" stroke="#35e6d2" opacity=".18">
    <polygon points="1090,282 1105,273 1120,282 1120,300 1105,309 1090,300"><animateTransform attributeName="transform" type="translate" values="0 0;0 7;0 0" dur="8s" repeatCount="indefinite"/></polygon>
  </g>
</svg>