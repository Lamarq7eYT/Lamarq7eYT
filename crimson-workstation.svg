<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Evandro Development Workstation</title>
  <desc id="desc">Animated crimson workstation panel with hardware specifications and a fake 3D Fractal Design North XL PC.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0b0d"/><stop offset="1" stop-color="#050506"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#ff1538" stop-opacity=".16"/><stop offset=".28" stop-color="#21090e" stop-opacity=".82"/><stop offset="1" stop-color="#0a0a0c" stop-opacity=".9"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20242a" stop-opacity=".78"/><stop offset=".5" stop-color="#08090b" stop-opacity=".88"/><stop offset="1" stop-color="#3a0b14" stop-opacity=".56"/></linearGradient>
    <linearGradient id="metal" x1="0" x2="1"><stop stop-color="#090a0c"/><stop offset=".45" stop-color="#35383f"/><stop offset=".62" stop-color="#777b85"/><stop offset="1" stop-color="#0b0c0e"/></linearGradient>
    <linearGradient id="wood" x1="0" x2="1"><stop stop-color="#2e1a12"/><stop offset=".42" stop-color="#71432c"/><stop offset=".62" stop-color="#a46642"/><stop offset="1" stop-color="#2a1710"/></linearGradient>
    <linearGradient id="sweep" x1="0" x2="1"><stop stop-color="#ff1538" stop-opacity="0"/><stop offset=".46" stop-color="#ff1538" stop-opacity=".08"/><stop offset=".5" stop-color="#ff6c7f" stop-opacity=".72"/><stop offset=".56" stop-color="#ff1538" stop-opacity=".10"/><stop offset="1" stop-color="#ff1538" stop-opacity="0"/></linearGradient>
    <radialGradient id="fanGlow"><stop stop-color="#ff8b9a" stop-opacity=".75"/><stop offset=".28" stop-color="#ff1538" stop-opacity=".42"/><stop offset="1" stop-color="#ff1538" stop-opacity="0"/></radialGradient>
    <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="12" result="b"/><feOffset dy="14" result="o"/><feFlood flood-color="#000" flood-opacity=".7" result="f"/><feComposite in="f" in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#ff1538" stroke-opacity=".035"/></pattern>
    <style>
      .ui{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .label{font-size:13px;letter-spacing:2.6px;fill:#ff536b}.name{font-size:19px;font-weight:700;fill:#fff}.sub{font-size:14px;fill:#a9abb1}.tiny{font-size:12px;fill:#696c73}
    </style>
  </defs>

  <rect width="1400" height="760" fill="#050505"/>
  <rect x="30" y="28" width="1340" height="704" rx="16" fill="url(#panel)" stroke="#3b0b14" stroke-width="1.5"/>
  <rect x="30" y="28" width="1340" height="704" rx="16" fill="url(#grid)"/>

  <!-- ambient crimson bloom -->
  <ellipse cx="1080" cy="420" rx="330" ry="260" fill="#ff1538" opacity=".055" filter="url(#blur18)"/>
  <ellipse cx="160" cy="120" rx="230" ry="130" fill="#ff1538" opacity=".035" filter="url(#blur18)"/>

  <!-- background hexagons -->
  <g fill="none" stroke="#ff1538" stroke-width="1.6" opacity=".22">
    <polygon points="1220,86 1240,74 1260,86 1260,110 1240,122 1220,110"><animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="8s" repeatCount="indefinite"/></polygon>
    <polygon points="760,610 776,601 792,610 792,628 776,637 760,628"><animateTransform attributeName="transform" type="translate" values="0 0;7 -5;0 0" dur="10s" repeatCount="indefinite"/></polygon>
    <polygon points="95,646 112,636 129,646 129,666 112,676 95,666"><animateTransform attributeName="transform" type="translate" values="0 0;-5 6;0 0" dur="9s" repeatCount="indefinite"/></polygon>
  </g>

  <!-- intermittent glitch accents -->
  <g fill="#ff1538" opacity="0">
    <rect x="58" y="42" width="126" height="4"><animate attributeName="opacity" values="0;0;.7;0;0" keyTimes="0;.72;.75;.78;1" dur="4.7s" repeatCount="indefinite"/></rect>
    <rect x="690" y="92" width="78" height="3"><animate attributeName="opacity" values="0;0;.6;0;0" keyTimes="0;.45;.47;.5;1" dur="5.3s" repeatCount="indefinite"/></rect>
    <rect x="1160" y="685" width="144" height="4"><animate attributeName="opacity" values="0;0;.55;0;0" keyTimes="0;.61;.64;.67;1" dur="6.1s" repeatCount="indefinite"/></rect>
    <rect x="650" y="690" width="42" height="10"><animate attributeName="opacity" values="0;0;.35;0;0" keyTimes="0;.31;.33;.36;1" dur="4.1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- left information block -->
  <g>
    <text x="76" y="78" class="mono label">DEVELOPMENT WORKSTATION / REV. 01</text>
    <text x="76" y="119" class="ui" font-size="34" font-weight="800" fill="#ffffff">Fractal Design North XL</text>
    <text x="76" y="147" class="mono" font-size="14" fill="#777b82">CHARCOAL • ATX FULL TOWER • CUSTOM DEVELOPMENT / CREATIVE RIG</text>
    <path d="M76 170H700" stroke="#2f1117"/><path d="M76 170H238" stroke="#ff1538" stroke-width="2"/>

    <g transform="translate(76 192)">
      <g><rect width="628" height="58" rx="8" fill="url(#card)" stroke="#40101a"/><text x="18" y="22" class="mono label">CPU</text><text x="18" y="45" class="ui name">AMD Ryzen 9 9950X3D • 16-Core • 4.3 GHz</text></g>
      <g transform="translate(0 68)"><rect width="628" height="58" rx="8" fill="url(#card)" stroke="#40101a"/><text x="18" y="22" class="mono label">GPU</text><text x="18" y="45" class="ui name">MSI GeForce RTX 5070 Ti Shadow 3X • 16 GB</text></g>
      <g transform="translate(0 136)"><rect width="628" height="58" rx="8" fill="url(#card)" stroke="#40101a"/><text x="18" y="22" class="mono label">MEMORY</text><text x="18" y="45" class="ui name">G.Skill Trident Z5 • 64 GB DDR5</text></g>
      <g transform="translate(0 204)"><rect width="628" height="58" rx="8" fill="url(#card)" stroke="#40101a"/><text x="18" y="22" class="mono label">MOTHERBOARD</text><text x="18" y="45" class="ui name">ASUS ROG Crosshair X870E Hero • AM5</text></g>
      <g transform="translate(0 272)"><rect width="628" height="58" rx="8" fill="url(#card)" stroke="#40101a"/><text x="18" y="22" class="mono label">COOLING</text><text x="18" y="45" class="ui name">DeepCool LE360 V2 ARGB • 360 mm + 6× ML120 Pro RGB</text></g>
      <g transform="translate(0 340)"><rect width="628" height="58" rx="8" fill="url(#card)" stroke="#40101a"/><text x="18" y="22" class="mono label">STORAGE</text><text x="18" y="45" class="ui name">2× Samsung 9100 PRO 2 TB NVMe • 4 TB Total</text></g>
      <g transform="translate(0 408)"><rect width="628" height="58" rx="8" fill="url(#card)" stroke="#40101a"/><text x="18" y="22" class="mono label">POWER</text><text x="18" y="45" class="ui name">ASUS TUF Gaming 1000W • 80+ Gold • Full Modular</text></g>
    </g>

    <text x="76" y="694" class="mono tiny">PRIMARY USE / SOFTWARE DEVELOPMENT • 2D/3D • MOTION • VFX • RENDERING</text>
  </g>

  <!-- fake 3D North XL tower -->
  <g transform="translate(780 100)" filter="url(#shadow)">
    <g transform="translate(235 282)">
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="-1.2;1.2;-1.2" dur="10s" repeatCount="indefinite"/>
      <g transform="translate(-235 -282)">
        <!-- floor shadow -->
        <ellipse cx="250" cy="580" rx="205" ry="28" fill="#000" opacity=".72"/>
        <ellipse cx="258" cy="573" rx="145" ry="15" fill="#ff1538" opacity=".08" filter="url(#blur10)"/>

        <!-- main chassis / side glass face -->
        <polygon points="55,48 338,68 338,548 55,525" fill="#08090b" stroke="#454850" stroke-width="3"/>
        <polygon points="74,72 316,88 316,506 74,489" fill="url(#glass)" stroke="#272a30" stroke-width="2"/>
        <path d="M88 92L300 106V474L88 460Z" fill="#050607" opacity=".70"/>

        <!-- visible internal motherboard -->
        <polygon points="119,150 259,159 259,370 119,360" fill="#17191e" stroke="#444852" stroke-width="2"/>
        <g stroke="#2d3138" opacity=".8"><path d="M132 180L246 187"/><path d="M132 211L246 218"/><path d="M132 242L246 249"/><path d="M132 273L246 280"/><path d="M132 304L246 311"/><path d="M154 166L154 350"/><path d="M211 170L211 354"/></g>
        <rect x="167" y="209" width="47" height="42" rx="5" fill="#252930" stroke="#646a75"/>
        <circle cx="190" cy="230" r="13" fill="#0b0d10" stroke="#ff1538" stroke-opacity=".55"/>

        <!-- RAM sticks -->
        <g transform="skewY(4)"><rect x="222" y="177" width="8" height="69" rx="2" fill="#8d93a0"/><rect x="234" y="178" width="8" height="69" rx="2" fill="#565c68"/><path d="M222 186H242" stroke="#ff1538" stroke-width="2" opacity=".72"/></g>

        <!-- long GPU -->
        <polygon points="106,287 286,298 286,346 106,334" fill="#16191d" stroke="#555a63" stroke-width="2"/>
        <polygon points="116,297 272,307 272,327 116,318" fill="#262a30"/>
        <circle cx="158" cy="314" r="17" fill="#090a0c" stroke="#4d5159"/><circle cx="222" cy="318" r="17" fill="#090a0c" stroke="#4d5159"/><circle cx="272" cy="321" r="10" fill="#090a0c" stroke="#4d5159"/>
        <path d="M121 292L278 302" stroke="#ff1538" stroke-width="2" opacity=".45"/>

        <!-- AIO radiator / top fans -->
        <polygon points="100,101 281,112 281,143 100,132" fill="#111317" stroke="#474b53"/>
        <g fill="#090a0b" stroke="#545963"><circle cx="137" cy="121" r="16"/><circle cx="191" cy="124" r="16"/><circle cx="245" cy="127" r="16"/></g>
        <g fill="url(#fanGlow)" opacity=".72"><circle cx="137" cy="121" r="24"><animate attributeName="opacity" values=".24;.75;.24" dur="3.1s" repeatCount="indefinite"/></circle><circle cx="191" cy="124" r="24"><animate attributeName="opacity" values=".75;.24;.75" dur="3.1s" repeatCount="indefinite"/></circle><circle cx="245" cy="127" r="24"><animate attributeName="opacity" values=".24;.75;.24" dur="3.1s" repeatCount="indefinite"/></circle></g>

        <!-- front intake fans hinted behind wood -->
        <g opacity=".55"><circle cx="363" cy="175" r="48" fill="url(#fanGlow)"/><circle cx="365" cy="284" r="48" fill="url(#fanGlow)"/><circle cx="367" cy="394" r="48" fill="url(#fanGlow)"/></g>

        <!-- PSU shroud -->
        <polygon points="88,390 302,405 302,480 88,465" fill="#111317" stroke="#353941"/><text x="117" y="438" class="mono" font-size="11" fill="#666b75" transform="rotate(4 117 438)">1000W / 80+ GOLD</text>

        <!-- front face, North-style wood slats -->
        <polygon points="338,68 432,44 432,522 338,548" fill="#070809" stroke="#4b4e55" stroke-width="3"/>
        <polygon points="350,86 416,69 416,491 350,510" fill="#100b09" stroke="#3c2b25"/>
        <g fill="url(#wood)">
          <polygon points="354,91 361,89 361,505 354,507"/><polygon points="365,88 372,86 372,502 365,504"/><polygon points="376,85 383,83 383,499 376,501"/><polygon points="387,82 394,80 394,496 387,498"/><polygon points="398,79 405,77 405,493 398,495"/><polygon points="409,76 414,75 414,490 409,492"/>
        </g>
        <path d="M350 86L416 69" stroke="#c4865f" stroke-opacity=".32"/>

        <!-- case feet -->
        <path d="M80 520L113 523L106 554L76 552Z" fill="#08090a"/><path d="M311 537L335 541L333 563L309 559Z" fill="#08090a"/>

        <!-- moving reflection across glass -->
        <g opacity=".85">
          <polygon points="-30,60 35,64 300,530 238,525" fill="url(#sweep)">
            <animateTransform attributeName="transform" type="translate" values="-250 0;330 0;-250 0" dur="7.8s" repeatCount="indefinite"/>
          </polygon>
        </g>

        <!-- small chassis labels -->
        <text x="84" y="548" class="mono" font-size="12" fill="#9a9da4">NORTH XL</text>
        <circle cx="404" cy="57" r="3" fill="#ff1538"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
      </g>
    </g>
  </g>

  <!-- right-side callout -->
  <g class="mono"><text x="1115" y="690" font-size="12" fill="#ff536b">FAKE 3D / SVG</text><text x="1115" y="709" font-size="11" fill="#666a72">SLOW ROTATION • LIVE ANIMATION</text></g>

  <!-- scanning accent -->
  <rect x="-260" y="35" width="220" height="690" fill="url(#sweep)" opacity=".22" transform="skewX(-12)"><animate attributeName="x" values="-260;1540" dur="11s" repeatCount="indefinite"/></rect>
</svg>