<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Evandro crimson subway header">
<defs>
  <linearGradient id="carBg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#090607"/><stop offset=".55" stop-color="#060506"/><stop offset="1" stop-color="#130609"/></linearGradient>
  <linearGradient id="windowBase" x1="0" x2="1"><stop stop-color="#2a0609"/><stop offset=".45" stop-color="#090607"/><stop offset="1" stop-color="#2e070a"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#090707"/><stop offset="1" stop-color="#26070d"/></linearGradient>
  <linearGradient id="rush" x1="0" x2="1"><stop stop-color="#ff1538" stop-opacity="0"/><stop offset=".42" stop-color="#ff1538" stop-opacity=".12"/><stop offset=".5" stop-color="#ff5b62" stop-opacity=".95"/><stop offset=".58" stop-color="#ff1538" stop-opacity=".16"/><stop offset="1" stop-color="#ff1538" stop-opacity="0"/></linearGradient>
  <radialGradient id="redBloom"><stop stop-color="#ff4d55" stop-opacity=".85"/><stop offset=".35" stop-color="#ff1538" stop-opacity=".35"/><stop offset="1" stop-color="#ff1538" stop-opacity="0"/></radialGradient>
  <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="blur5"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".6" fill="#fff" opacity=".02"/><circle cx="6" cy="5" r=".5" fill="#ff1538" opacity=".025"/></pattern>
  <clipPath id="windows"><rect x="820" y="62" width="340" height="200" rx="2"/></clipPath>
</defs>
<rect width="1200" height="420" fill="url(#carBg)"/>
<path d="M0 0H1200V48H0Z" fill="#050405"/>
<path d="M0 315H1200V420H0Z" fill="url(#floor)"/>
<path d="M0 50H44V315H0Z" fill="#15080a"/>
<path d="M1180 50H1200V315H1180Z" fill="#16090b"/>
<path d="M0 315L470 245H820L1200 315Z" fill="#0c0708" opacity=".85"/>

<!-- left sliding-door area -->
<g opacity=".95">
  <rect x="32" y="76" width="255" height="223" rx="5" fill="#0a0808" stroke="#541019" stroke-width="2"/>
  <rect x="52" y="92" width="215" height="92" rx="3" fill="#15080a" stroke="#761323"/>
  <path d="M159 76V299" stroke="#4a1119" stroke-width="3"/>
  <path d="M50 204H268" stroke="#431018"/>
  <rect x="24" y="62" width="275" height="10" fill="#22090d"/>
  <rect x="242" y="212" width="8" height="45" rx="4" fill="#2b0b11" stroke="#771626"/>
</g>

<!-- carriage wall ribs -->
<g fill="#0c0809" stroke="#361018" stroke-width="2" opacity=".95">
  <rect x="304" y="76" width="42" height="225" rx="4"/>
  <rect x="360" y="76" width="42" height="225" rx="4"/>
</g>

<!-- right subway windows and rubber/metal frames -->
<rect x="802" y="48" width="378" height="230" rx="5" fill="#080606" stroke="#5b121c" stroke-width="3"/>
<rect x="813" y="59" width="356" height="208" rx="3" fill="none" stroke="#241014" stroke-width="8" opacity=".9"/>
<g stroke="#53131c" stroke-width="5"><path d="M888 50V278"/><path d="M974 50V278"/><path d="M1060 50V278"/><path d="M1146 50V278"/></g>
<g fill="url(#windowBase)"><rect x="816" y="64" width="68" height="194"/><rect x="892" y="64" width="78" height="194"/><rect x="978" y="64" width="78" height="194"/><rect x="1064" y="64" width="78" height="194"/><rect x="1150" y="64" width="20" height="194"/></g>
<g clip-path="url(#windows)"><g><rect x="760" y="60" width="88" height="205" fill="#ff1a30" opacity=".82"/><rect x="888" y="60" width="42" height="205" fill="#ff4a2f" opacity=".96"/><rect x="990" y="60" width="125" height="205" fill="#ff241f" opacity=".9"/><rect x="1160" y="60" width="60" height="205" fill="#ff6a35" opacity=".9"/><animateTransform attributeName="transform" type="translate" values="420 0;-520 0" dur="1.25s" repeatCount="indefinite"/></g><g opacity=".55"><rect x="700" y="60" width="18" height="205" fill="#fff2e9"/><rect x="920" y="60" width="10" height="205" fill="#ff9b77"/><rect x="1120" y="60" width="16" height="205" fill="#fff0e5"/><animateTransform attributeName="transform" type="translate" values="480 0;-560 0" dur=".82s" repeatCount="indefinite"/></g></g>

<!-- recognizable subway hardware -->
<path d="M280 58H1005" stroke="#3f151b" stroke-width="5"/>
<path d="M305 71H790" stroke="#1f0b0e" stroke-width="8" opacity=".8"/>
<g fill="none" stroke="#671521" stroke-width="3" opacity=".85"><path d="M420 58v28l-12 18h24l-12-18"/><path d="M560 58v28l-12 18h24l-12-18"/><path d="M700 58v28l-12 18h24l-12-18"/></g>
<g stroke="#2d1116" stroke-width="5"><path d="M336 58V318"/><path d="M780 58V318"/></g>
<g fill="#11090b" stroke="#361018" stroke-width="2"><path d="M420 295H740V352H390Z"/><path d="M430 302H730V331H415Z"/></g>
<g stroke="#51131d" opacity=".75"><path d="M438 304V330"/><path d="M502 304V330"/><path d="M566 304V330"/><path d="M630 304V330"/><path d="M694 304V330"/></g>

<!-- fast window light casts entering the carriage -->
<g opacity=".78"><path d="M1280 70L880 145L670 355H835L1260 210Z" fill="url(#rush)" filter="url(#blur5)"><animateTransform attributeName="transform" type="translate" values="260 0;-650 0" dur="1.35s" repeatCount="indefinite"/></path><path d="M1360 20L970 120L795 420H890L1320 140Z" fill="#ff1538" opacity=".14" filter="url(#blur12)"><animateTransform attributeName="transform" type="translate" values="240 0;-700 0" dur="1.05s" repeatCount="indefinite"/></path></g>

<!-- floor reflections -->
<g opacity=".26"><path d="M845 300L1200 270V420H720Z" fill="url(#redBloom)"/><path d="M890 315L1125 315L1190 420H790Z" fill="#ff1538"><animate attributeName="opacity" values=".06;.24;.07" dur="1.2s" repeatCount="indefinite"/></path></g>
<rect width="1200" height="420" fill="url(#grain)"/>

<!-- foreground README UI -->
<rect x="45" y="34" width="1110" height="352" rx="8" fill="#020203" opacity=".10" stroke="#ff1538" stroke-opacity=".13"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="78" y="72" fill="#ffb2bd" font-size="15" letter-spacing="3">SYSTEM 01</text><circle cx="1065" cy="67" r="5" fill="#ff1538"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle><text x="1082" y="72" fill="#f0dadd" font-size="14">ONLINE</text></g>
<path d="M48 120H690L635 330H48Z" fill="#030303" opacity=".66"/>
<text x="78" y="215" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="100" font-weight="800" letter-spacing="2">EVANDRO</text>
<rect x="78" y="247" width="320" height="4" fill="#ff1538"><animate attributeName="width" values="110;320;255;320" dur="6s" repeatCount="indefinite"/></rect>
<text x="80" y="300" fill="#ded5d6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" letter-spacing="3">FULL-STACK DEVELOPER • 2D/3D ANIMATOR</text>
</svg>